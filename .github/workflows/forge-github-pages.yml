name: Forge GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - "queries/logan_ql_reference_catalog.json"
      - "queries/cross_ql_mapping_patterns.json"
      - "queries/conversion_examples.json"
      - "queries/ql_conversion_capability_matrix.json"
      - "queries/siem_log_examples.json"
      - ".github/workflows/forge-github-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-preflight:
    name: GitHub Pages availability
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Verify GitHub Pages is enabled
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getPages({ owner, repo });
              core.setOutput("enabled", "true");
              await core.summary
                .addHeading("GitHub Pages preflight")
                .addRaw("GitHub Pages is enabled. The static Forge export will be deployed.")
                .write();
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput("enabled", "false");
              core.warning("GitHub Pages is not enabled; the static export will be built but deployment is skipped.");
              await core.summary
                .addHeading("GitHub Pages preflight")
                .addRaw("Static Forge export built successfully, but deployment was skipped because GitHub Pages is disabled. Enable Pages with GitHub Actions as the source in repository Settings > Pages, then rerun this workflow.")
                .write();
            }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install webapp dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      - name: Build static Forge export
        working-directory: webapp
        env:
          NEXT_PUBLIC_FORGE_BASE_PATH: "/${{ github.event.repository.name }}"
        run: pnpm build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/out

  deploy:
    needs:
      - build
      - pages-preflight
    if: needs.pages-preflight.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
