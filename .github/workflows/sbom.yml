name: SBOM freshness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Check CycloneDX SBOM
        run: python scripts/generate_sbom.py --check
