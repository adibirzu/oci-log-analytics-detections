title: Caldera - Credential Search in Files via grep (Linux)
id: bd4bfb83-f68b-4688-b240-2fe5629a7ea8
status: experimental
description: >
  Detects use of grep or find to search for credentials stored in configuration
  and history files. Caldera T1552.001 emulation runs grep -r with keywords like
  password, passwd, secret, token, and apikey across common configuration paths.
  Complements the SSRF/metadata credential rules with file-system-based grep detection.
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: linux
  service: syslog
detection:
  sel_grep_password:
    message|contains:
      - 'grep -r password'
      - 'grep -ri password'
      - 'grep -r passwd'
      - 'grep -ri passwd'
      - 'grep -r secret'
      - 'grep -r apikey'
      - 'grep -r api_key'
      - 'grep -r token'
  sel_grep_in_dirs:
    message|contains:
      - 'grep -r /etc/'
      - 'grep -r /home/'
      - 'grep -r /root/'
      - 'grep -r /var/www/'
      - 'grep -r /opt/'
  sel_history_access:
    message|contains:
      - 'cat /root/.bash_history'
      - 'cat /home/'
      - '.bash_history'
      - 'cat /root/.mysql_history'
  sel_netrc:
    message|contains:
      - 'cat /root/.netrc'
      - 'cat ~/.netrc'
      - 'cat /home/'
      - '.netrc'
  condition: sel_grep_password or sel_grep_in_dirs or sel_history_access or sel_netrc
level: medium
tags:
  - attack.credential_access
  - attack.t1552
  - attack.t1552.001
falsepositives:
  - Security hardening scripts searching for credential leaks
  - Configuration auditing tools
version: 1
