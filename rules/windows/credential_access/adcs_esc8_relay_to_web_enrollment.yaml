title: "ADCS ESC8: NTLM Relay to Certificate Web Enrollment"
id: 4dbd9e56-4007-402c-96ae-3a3c886b6203
status: experimental
description: >
  Detects ESC8 attacks relaying coerced NTLM authentication to the ADCS HTTP
  web-enrollment endpoint (certsrv) to obtain a certificate for a DC or
  privileged account. Indicators include Certipy 'relay' mode and ntlmrelayx
  targeting /certsrv/certfnsh.asp. In GOAD this is chained with PetitPotam.
references:
  - https://attack.mitre.org/techniques/T1649/
  - https://attack.mitre.org/techniques/T1557/001/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'certipy relay'
      - '-target http'
      - 'certsrv'
      - 'certfnsh.asp'
      - 'CertificateWebEnrollment'
      - '-template DomainController'
  condition: selection
level: critical
tags:
  - attack.credential_access
  - attack.t1649
  - attack.t1557.001
falsepositives:
  - Authorized ADCS relay assessments
version: 1
