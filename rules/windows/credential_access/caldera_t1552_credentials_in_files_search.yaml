title: Caldera - Credential Search in Config and Environment Files (Windows)
id: 5f9ce881-f953-423e-8a6f-ce8749e56b5f
status: experimental
description: >
  Detects broad-scope search for credentials stored in configuration files, scripts,
  and environment files. Caldera T1552 emulation runs findstr with password-related
  keywords across common file types and user profile directories, extending beyond
  the specific filename-based search in credential_file_discovery.yaml.
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  sel_findstr_keyword:
    Image|endswith: \findstr.exe
    CommandLine|contains:
      - 'password'
      - 'passwd'
      - 'secret'
      - 'apikey'
      - 'api_key'
      - 'token'
  sel_findstr_recursive:
    CommandLine|contains:
      - '/s'
      - '/r'
  sel_ps_grep:
    CommandLine|contains:
      - 'Select-String'
      - 'sls '
      - 'Get-Content'
  sel_ps_keyword:
    CommandLine|contains:
      - 'password'
      - 'passwd'
      - 'apikey'
      - 'api_key'
      - 'secret'
  sel_env_file:
    CommandLine|contains:
      - '.env'
      - 'config.json'
      - 'appsettings.json'
      - 'web.config'
      - 'database.config'
  condition: (sel_findstr_keyword and sel_findstr_recursive) or (sel_ps_grep and sel_ps_keyword) or sel_env_file
level: medium
tags:
  - attack.credential_access
  - attack.t1552
  - attack.t1552.001
falsepositives:
  - Security hardening scripts auditing for credential exposure
  - Static analysis tools scanning for secrets
version: 1
