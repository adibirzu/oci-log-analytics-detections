title: "gMSA Managed Password Read Attempt"
id: d24c2870-c7e5-40bf-aa73-47acaf467e64
status: experimental
description: >
  Detects attempts to read the msDS-ManagedPassword blob of a group Managed
  Service Account (gMSA), allowing computation of the account's NTLM hash.
  Tools include GMSAPasswordReader and Get-ADServiceAccount -Properties
  msDS-ManagedPassword. GOAD exposes gmsaDragon as a gMSA read target.
references:
  - https://attack.mitre.org/techniques/T1555/
  - https://attack.mitre.org/techniques/T1003/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'msDS-ManagedPassword'
      - 'GMSAPasswordReader'
      - 'Get-ADServiceAccount'
      - 'ConvertFrom-ADManagedPasswordBlob'
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1555
falsepositives:
  - gMSA administration and troubleshooting
version: 1
