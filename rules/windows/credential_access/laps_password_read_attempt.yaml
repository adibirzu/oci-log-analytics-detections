title: "LAPS Clear-Text Local Admin Password Read Attempt"
id: ff473b72-ba36-43e4-9bec-e940499899cd
status: experimental
description: >
  Detects attempts to read the LAPS-managed local administrator password from
  the ms-Mcs-AdmPwd attribute. Tooling includes LAPSToolkit, Get-AdmPwdPassword,
  and pyLAPS. GOAD includes a LAPS reader path to recover local admin passwords.
references:
  - https://attack.mitre.org/techniques/T1555/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'ms-Mcs-AdmPwd'
      - 'Get-AdmPwdPassword'
      - 'LAPSToolkit'
      - 'pyLAPS'
      - 'Get-LAPSADPassword'
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1555
falsepositives:
  - LAPS administrative password retrieval by helpdesk
version: 1
