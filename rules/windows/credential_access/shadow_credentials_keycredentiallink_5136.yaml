title: "Shadow Credentials: msDS-KeyCredentialLink Modified (Event 5136)"
id: 7e9ca45b-3cd3-419c-886d-d803c3001e4c
status: experimental
description: >
  Detects shadow-credentials attacks at the directory layer: a write to the
  msDS-KeyCredentialLink attribute (Event 5136, schemaIDGUID
  5b47d60f-6090-40b2-9f37-2a4de88f3063) adds an attacker-controlled key pair so
  PKINIT can mint a TGT for the victim. Complements the existing Whisker
  process-creation rule with the authoritative DS-change event.
references:
  - https://attack.mitre.org/techniques/T1556/
  - https://attack.mitre.org/techniques/T1098/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    Properties|contains:
      - '5b47d60f-6090-40b2-9f37-2a4de88f3063'
      - 'msDS-KeyCredentialLink'
  condition: selection
level: critical
tags:
  - attack.credential_access
  - attack.t1556
  - attack.persistence
  - attack.t1098
falsepositives:
  - Windows Hello for Business / passwordless key enrollment
version: 1
