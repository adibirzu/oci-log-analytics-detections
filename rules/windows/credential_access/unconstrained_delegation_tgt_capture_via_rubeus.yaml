title: "Unconstrained Delegation TGT Capture via Rubeus monitor"
id: af4af474-cd38-46b5-a5e9-5a7430c34b40
status: experimental
description: >
  Detects harvesting of TGTs cached on a host trusted for unconstrained
  delegation. Rubeus 'monitor'/'dump' continuously extracts forwarded TGTs
  (often paired with a coercion such as Printerbug to force a DC to
  authenticate). GOAD chains unconstrained delegation with the printer bug.
references:
  - https://attack.mitre.org/techniques/T1558/
  - https://attack.mitre.org/techniques/T1550/003/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'monitor /interval'
      - 'rubeus monitor'
      - 'triage'
  selection_dump:
    CommandLine|contains|all:
      - 'dump'
      - '/service:krbtgt'
  condition: selection or selection_dump
level: high
tags:
  - attack.credential_access
  - attack.t1558
falsepositives:
  - Authorized Kerberos delegation assessments
version: 1
