title: "ADCS ESC6: EDITF_ATTRIBUTESUBJECTALTNAME2 Flag Enabled via Certutil"
id: 4fb239f7-b0e6-472e-8e4e-1575b6bcbf1f
status: experimental
description: >
  Detects enabling of the EDITF_ATTRIBUTESUBJECTALTNAME2 policy flag on an
  Enterprise CA (ESC6). When set, any requester can specify an arbitrary SAN
  on any certificate request, allowing domain-wide impersonation. Set via
  'certutil -setreg policy\EditFlags'. GOAD demonstrates this on the SRV03 CA.
references:
  - https://attack.mitre.org/techniques/T1649/
  - https://posts.specterops.io/certified-pre-owned-d95910965cd2
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'setreg'
      - 'EditFlags'
  selection_flag:
    CommandLine|contains:
      - 'EDITF_ATTRIBUTESUBJECTALTNAME2'
      - 'ATTRIBUTESUBJECTALTNAME2'
  condition: selection or selection_flag
level: critical
tags:
  - attack.defense_evasion
  - attack.credential_access
  - attack.t1649
falsepositives:
  - Legitimate CA policy administration (rare; should be change-controlled)
version: 1
