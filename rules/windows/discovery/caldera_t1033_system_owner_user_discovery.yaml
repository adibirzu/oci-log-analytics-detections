title: Caldera - System Owner and User Discovery (Windows)
id: df034b80-b4db-4f74-a7ed-292bd361aa5a
status: experimental
description: >
  Detects commands used to discover the current system owner and logged-in users.
  Caldera T1033 emulation runs whoami, query user, and PowerShell Get-LocalUser
  to determine privilege context, active sessions, and user account details
  immediately after gaining access to a Windows endpoint.
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  sel_whoami:
    Image|endswith: \whoami.exe
  sel_query_user:
    Image|endswith: \query.exe
    CommandLine|contains:
      - 'user'
      - 'session'
  sel_ps_user:
    CommandLine|contains:
      - 'Get-LocalUser'
      - 'Get-LocalGroup'
      - '[System.Security.Principal.WindowsIdentity]::GetCurrent'
      - '$env:USERNAME'
  sel_net_user:
    Image|endswith:
      - \net.exe
      - \net1.exe
    CommandLine|contains: 'user'
  condition: sel_whoami or sel_query_user or sel_ps_user or sel_net_user
level: low
tags:
  - attack.discovery
  - attack.t1033
falsepositives:
  - Login scripts checking user context
  - Administrative tooling verifying run-as identity
  - Help desk automation querying session state
version: 1
