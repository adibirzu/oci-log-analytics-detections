title: "Computer Account Creation for Delegation Abuse (MachineAccountQuota)"
id: 2abd42ec-ece4-45b0-8d96-13f0f324cf77
status: experimental
description: >
  Detects creation of a new computer account by an unprivileged user abusing the
  default MachineAccountQuota (10). Attacker-created machine accounts are the
  pivot for RBCD takeovers and Certifried (CVE-2022-26923). Tools include
  impacket addcomputer.py and PowerMad New-MachineAccount.
references:
  - https://attack.mitre.org/techniques/T1136/002/
  - https://attack.mitre.org/techniques/T1098/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'New-MachineAccount'
      - 'addcomputer.py'
      - 'addcomputer'
      - 'PowerMad'
      - '-computer-name'
  condition: selection
level: high
tags:
  - attack.persistence
  - attack.t1136.002
  - attack.privilege_escalation
  - attack.t1098
falsepositives:
  - Legitimate domain-join automation
version: 1
