title: Caldera - Exfiltration to Web Service from Windows Endpoint
id: d768a458-8aed-499e-9493-2f4d548e90d5
status: experimental
description: >
  Detects uploads of collected data to public web services from Windows hosts.
  Caldera T1567 emulation uses PowerShell or curl to push staged files to paste
  sites, anonymous file-share services, or cloud storage APIs. This complements
  the OneDrive-specific BLUELIGHT APT rule with a general cross-service detection.
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  sel_paste_in_cmd:
    CommandLine|contains:
      - 'pastebin.com'
      - 'paste.ee'
      - 'transfer.sh'
      - 'file.io'
      - 'ix.io'
      - '0x0.st'
  sel_cloud_upload:
    CommandLine|contains:
      - 's3.amazonaws.com'
      - 'storage.googleapis.com'
      - 'blob.core.windows.net'
      - 'objectstorage.oraclecloud.com'
  sel_invoke_web:
    CommandLine|contains:
      - 'Invoke-WebRequest'
      - 'Invoke-RestMethod'
      - 'curl.exe'
      - 'wget.exe'
  condition: (sel_paste_in_cmd or sel_cloud_upload) and sel_invoke_web
level: high
tags:
  - attack.exfiltration
  - attack.t1567
falsepositives:
  - Developers testing API uploads
  - Authorized DevOps pipelines deploying to cloud storage
version: 1
