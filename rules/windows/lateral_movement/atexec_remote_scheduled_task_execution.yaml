title: "Impacket atexec Remote Scheduled Task Execution"
id: 407543f0-898a-4b2c-bfb3-804bb2a0ede6
status: experimental
description: >
  Detects impacket atexec, which creates a transient scheduled task on a remote
  host (via the ATSvc/Task Scheduler) to run a command and redirect output to an
  admin share. Indicators: a task launched by the Task Scheduler running cmd
  with output redirected to ADMIN$/a temp marker file.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - 'svchost.exe'
      - 'taskeng.exe'
  selection_cmd:
    CommandLine|contains|all:
      - 'cmd.exe'
      - '2>&1'
  selection_share:
    CommandLine|contains:
      - 'ADMIN$'
      - 'Temp'
      - '2>&1'
  condition: selection_parent and selection_cmd and selection_share
level: high
tags:
  - attack.execution
  - attack.t1053.005
  - attack.lateral_movement
falsepositives:
  - Legitimate scheduled-task based administration
version: 1
