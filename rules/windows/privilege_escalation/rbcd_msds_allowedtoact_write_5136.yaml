title: "RBCD: msDS-AllowedToActOnBehalfOfOtherIdentity Modified (Event 5136)"
id: cb96dce3-0170-4e00-96ae-239948a05f1f
status: experimental
description: >
  Detects writes to the msDS-AllowedToActOnBehalfOfOtherIdentity attribute via
  Directory Service object modification (Event 5136), the core of a
  Resource-Based Constrained Delegation (RBCD) takeover. The schemaIDGUID
  3f78c3e5-f79a-46bd-a0b8-9d18116ddc79 identifies the attribute. GOAD uses
  webdav+RBCD to take over computer objects.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/resource-based-constrained-delegation-ad-computer-object-take-over-and-privilged-code-execution
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    Properties|contains:
      - '3f78c3e5-f79a-46bd-a0b8-9d18116ddc79'
      - 'msDS-AllowedToActOnBehalfOfOtherIdentity'
  condition: selection
level: critical
tags:
  - attack.privilege_escalation
  - attack.t1098
falsepositives:
  - Legitimate Kerberos constrained-delegation administration
version: 1
