title: "SID History Added or Failed (Events 4765/4766)"
id: ddbc36d3-20f3-4341-a315-17563fed65a2
status: experimental
description: >
  Detects SID History modifications via Security events 4765 (SID History was
  added to an account) and 4766 (an attempt to add SID History failed).
  Injecting a privileged SID into sidHistory grants stealthy domain dominance.
references:
  - https://attack.mitre.org/techniques/T1134/005/
author: SOC Detection Engineering
date: 2026/06/11
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4765
      - 4766
  condition: selection
level: critical
tags:
  - attack.privilege_escalation
  - attack.t1134.005
falsepositives:
  - Legitimate cross-domain migrations using ADMT
version: 1
