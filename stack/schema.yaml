title: "OCI Log Analytics Detection Content Stack"
description: "Deploy supported OCI Log Analytics detection infrastructure, log sources, dashboards, and saved searches after reviewing the plan."
schemaVersion: 1.1.0
version: "1.0.0"
locale: "en"

variableGroups:
  - title: "General Configuration"
    description: "Required OCI identifiers"
    variables:
      - compartment_id
      - tenancy_ocid
      - region

  - title: "Log Analytics"
    description: "Log Analytics log group settings"
    variables:
      - log_group_name
      - log_group_description

  - title: "Streaming"
    description: "OCI Streaming configuration for log ingestion pipelines"
    variables:
      - stream_pool_id
      - stream_partitions
      - stream_retention_hours

  - title: "Provisioning Options"
    description: "Control which components are deployed via Python scripts"
    variables:
      - deploy_log_sources
      - deploy_dashboards
      - deploy_dashboard_cleanup
      - ingest_test_data

  - title: "Optional Splunk Evidence Exporter"
    description: "Disabled-by-default evidence export resources; review all identifiers and IAM before deployment"
    variables:
      - enable_splunk_evidence_exporter
      - enable_splunk_evidence_exporter_alarm_actions
      - enable_splunk_evidence_exporter_subscription
      - splunk_evidence_exporter_object_storage_namespace
      - splunk_evidence_exporter_existing_state_bucket_name
      - splunk_evidence_exporter_existing_dlq_bucket_name
      - splunk_evidence_exporter_function_subnet_ids
      - splunk_evidence_exporter_function_nsg_ids
      - splunk_evidence_exporter_function_image
      - splunk_evidence_exporter_function_image_digest
      - splunk_evidence_exporter_hec_secret_id
      - splunk_evidence_exporter_hec_url
      - splunk_evidence_exporter_hec_index

variables:
  compartment_id:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Compartment where all resources will be created"
    required: true

  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    description: "OCID of the tenancy (auto-populated by ORM)"
    required: true

  region:
    type: oci:identity:region:name
    title: "Region"
    description: "OCI region for deployment (auto-populated by ORM)"
    required: true

  log_group_name:
    type: string
    title: "Log Group Name"
    description: "Name of the Log Analytics log group for SOC detections"
    default: "soc-detection-test-logs"
    required: true

  log_group_description:
    type: string
    title: "Log Group Description"
    description: "Description for the Log Analytics log group"
    default: "Log group for SOC detection rules testing and validation"
    required: false

  stream_pool_id:
    type: string
    title: "Stream Pool OCID (Optional)"
    description: "OCID of an existing stream pool. Leave empty to create streams in the compartment directly."
    default: ""
    required: false

  stream_partitions:
    type: number
    title: "Stream Partitions"
    description: "Number of partitions per stream"
    default: 1
    required: false
    minimum: 1
    maximum: 10

  stream_retention_hours:
    type: number
    title: "Stream Retention (Hours)"
    description: "Message retention period in hours"
    default: 24
    required: false
    minimum: 24
    maximum: 168

  deploy_log_sources:
    type: boolean
    title: "Deploy Log Sources"
    description: "Create custom LA fields, parsers, and log sources via Python script"
    default: true
    required: false

  deploy_dashboards:
    type: boolean
    title: "Deploy Dashboards"
    description: "Deploy SOC detection dashboards and saved searches"
    default: true
    required: false

  deploy_dashboard_cleanup:
    type: boolean
    title: "Cleanup Existing Dashboards"
    description: "Remove existing SOC dashboards before deploying new ones (--cleanup flag)"
    default: true
    required: false
    visible: deploy_dashboards

  ingest_test_data:
    type: boolean
    title: "Ingest Test Data"
    description: "Upload test attack logs for validation (not recommended for production)"
    default: false
    required: false

  enable_splunk_evidence_exporter:
    type: boolean
    title: "Enable Splunk Evidence Exporter"
    description: "Create the optional exporter resources after target review"
    default: false
    required: false

  enable_splunk_evidence_exporter_alarm_actions:
    type: boolean
    title: "Enable Exporter Alarm Actions"
    description: "Review-gated. Enable Monitoring alarm actions for the exporter."
    default: false
    required: false
    visible: enable_splunk_evidence_exporter

  enable_splunk_evidence_exporter_subscription:
    type: boolean
    title: "Enable Exporter Function Subscription"
    description: "Review-gated. Enable the exact Notifications-to-Function subscription."
    default: false
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_hec_secret_id:
    type: string
    title: "Existing Vault Secret OCID"
    description: "Sensitive reference only. Existing OCI Vault secret OCID containing the HEC credential; never enter the secret value."
    default: ""
    required: false
    sensitive: true
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_object_storage_namespace:
    type: string
    title: "Object Storage Namespace"
    description: "Existing namespace for exporter checkpoint and DLQ storage."
    default: ""
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_existing_state_bucket_name:
    type: string
    title: "Existing State Bucket Name"
    description: "Optional existing private checkpoint bucket. Leave empty to create one with version lifecycle."
    default: ""
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_existing_dlq_bucket_name:
    type: string
    title: "Existing DLQ Bucket Name"
    description: "Optional existing private dead-letter bucket. Leave empty to create one with retention lifecycle."
    default: ""
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_function_subnet_ids:
    type: array
    title: "Existing Function Subnet OCIDs"
    description: "Existing reviewed subnets with HEC and OCI service reachability. This stack does not create a VCN."
    items:
      type: string
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_function_nsg_ids:
    type: array
    title: "Existing Function NSG OCIDs"
    description: "Optional existing network security groups restricting Function egress."
    items:
      type: string
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_function_image:
    type: string
    title: "Reviewed Exporter Image"
    description: "OCI Registry image containing the existing exporter handler."
    default: ""
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_function_image_digest:
    type: string
    title: "Exporter Image Digest"
    description: "Optional immutable sha256 digest paired with the reviewed image."
    default: ""
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_hec_url:
    type: string
    title: "Splunk HEC URL"
    description: "Reviewed HTTPS authority and exact /services/collector/event path. Userinfo, query strings, fragments, and embedded credentials are rejected."
    default: ""
    pattern: "^$|^https://[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*(:([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/services/collector/event$"
    required: false
    visible: enable_splunk_evidence_exporter

  splunk_evidence_exporter_hec_index:
    type: string
    title: "Splunk Evidence Index"
    description: "Reviewed target index for normalized evidence events."
    default: ""
    required: false
    visible: enable_splunk_evidence_exporter
